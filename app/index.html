<!DOCTYPE html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + React</title>
    
    <!-- 1. Suntikan Library Buffer Global via CDN Terpercaya -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/buffer/6.0.3/buffer.min.js" integrity="sha512-4xXf6Z9BwEIsmoxOWctG8MbhB6S1UAsXhNoit60IAnT7CAs3U69R9Vp7fX8K68GvRdBv3j6vSshqY8o7vI+vzA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    
    <!-- 2. Penguncian Objek Runtime Browser untuk SDK Solana -->
    <script>
      if (typeof window !== 'undefined') {
        window.global = window;
        // Mengunci objek Buffer dari CDN ke window global browser
        window.Buffer = window.Buffer || (typeof buffer !== 'undefined' ? buffer.Buffer : undefined);
        window.process = { env: {} };
      }
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
