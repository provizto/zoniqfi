name: Provizto Smart Contract Cloud Build

on:
  push:
    branches: [ main, master ]
    # 🔥 PENCEGAHAN EROR: Skrip Rust HANYA jalan jika folder program atau config Anchor berubah.
    # Jika Anda ubah Landing.jsx, workflow ini otomatis di-skip (tidak akan memicu tanda silang merah).
    paths:
      - 'programs/**'
      - 'Anchor.toml'
      - 'Cargo.toml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'programs/**'
      - 'Anchor.toml'
      - 'Cargo.toml'

jobs:
  solana-anchor-build:
    name: Compile Rust Contract on Cloud VM
    runs-on: ubuntu-latest

    steps:
      # 1. Mengunduh kode dari repositori Anda
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Pasang Rust Menggunakan Action Resmi (Lebih Cepat & Aman)
      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      # 3. Memasang dependensi Linux & Biner Solana/Anchor secara instan
      - name: Install Solana and Anchor Binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libssl-dev zlib1g-dev llvm clang make
          
          # Pasang Solana CLI
          curl -sSfL https://release.solana.com/v1.18.17/install | sh
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          
          # 🔥 SOLUSI UTAMA: Mengunduh biner Anchor yang sudah jadi (Pre-built), bukan compile dari nol!
          # Ini memangkas waktu instalasi dari 15 menit menjadi 5 detik.
          npm install -g @coral-xyz/anchor-cli@0.30.0

      # 4. Menghasilkan Keypair Otoritas dummy
      - name: Generate Dummy Solana Wallet Keypair
        run: |
          # Eksekusi langsung ke path active release yang sudah terpasang
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase --outfile ~/.config/solana/id.json

      # 5. Kompilasi Utama Program Rust
      - name: Execute Anchor Build
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          anchor build --skip-lint

      # 6. Mengunggah Hasil Kompilasi (.so dan JSON IDL)
      - name: Upload Compiled Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: provizto-compiled-binaries
          path: |
            target/deploy/vzt.so
            target/idl/vzt.json
